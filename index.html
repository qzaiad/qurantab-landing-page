<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <!-- 
      favicon is the icon displayed in the title. There are many websites which generate favicons from png/jpg... such as favicon.io (search for favicon).
      favicon is linked in the hrtml header section
   -->
  <link rel="shortcut icon" href="./images/favicon.ico" type="image/x-icon">

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="./styles/style.css" />
  <title>Quran Tab</title>
</head>

<body>

  <div class="container">
    <headher class="header">
      <div class="logoContent">
        <img class="logoContent__logo" src="./images/logo.png" alt="Quran's Tab Logo" />
        Quran Tab
      </div>
      <div class="links">
        <a href="#features" class="links__link">Features</a>
        <a href="#download" class="links__link">Download</a>
        <a href="#faq" class="links__link">FAQ</a>
      </div>
    </headher>

    <section class="section">
      <div class="section__content">
        <h1 class="section__title">Get closer to the Holy Quran</h1>
        <p class="section__description">
          A Chrome extension that replaces your new tab with a random ayah from the Quran. It keeps you inspired by a
          verse from the Quran every time you open a new tab.
        </p>
        <div class="section__buttons">
          <a class="section__button button" target="_blank" href="https://bit.ly/qt-chrome">
            Get it on Chrome
          </a>
          <a class="section__button button button--secondary" target="_blank" href="https://bit.ly/qt-edge">
            Get it on Edge
          </a>
        </div>
      </div>
      <div class="section__imageContent">
        <img class="section__image" src="./images/screen-1.png" alt="Quran Tab's Hero Image" />
      </div>
    </section>

  </div>

</body>

</html>
